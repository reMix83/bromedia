<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио — BRO MEDIA</title>
<meta name="description" content="Портфолио BRO MEDIA: видеомонтаж, видеосъёмка, моушн-дизайн и ИИ-генерации.">
<link rel="canonical" href="https://bromedia.pro/portfolio.html">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<meta property="og:title" content="Портфолио — BRO MEDIA">
<meta property="og:description" content="Работы студии: монтаж, съёмка, моушн-дизайн и ИИ-генерации.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bromedia.pro/portfolio.html">
<meta property="og:site_name" content="BRO MEDIA">
<meta property="og:image" content="https://bromedia.pro/assets/img/og-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bromedia.pro/assets/img/og-preview.jpg">
<meta name="theme-color" content="#0a1414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=7.5">
</head>
<body>

<header data-header></header>

<section class="section" style="padding-top:150px;">
  <div class="wrap" style="margin-bottom:44px;">
    <span class="eyebrow">Портфолио</span>
    <h1 style="font-size:clamp(32px,5vw,56px);margin-top:16px;">Работы студии</h1>
  </div>
</section>

<!-- ШОУРИЛ + ИИ-ПОРТФОЛИО (две горизонтальные плитки) -->
<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="work-grid showreel-grid">
      <article class="work reveal" data-showreel="showreal" style="cursor:pointer;">
        <img src="assets/img/cover_showreel.jpg" alt="Шоурил BRO MEDIA" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
        <div class="play-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"/></svg></div>
      </article>
      <article class="work reveal" data-showreel="ai" style="cursor:pointer;transition-delay:80ms;">
        <img src="assets/img/cover_ai.jpg" alt="Портфолио ИИ-генераций" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
        <div class="play-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"/></svg></div>
      </article>
    </div>
  </div>
</section>

<!-- Описание портфолио: что выбирать -->
<section class="section" style="padding-top:0;">
  <div class="wrap">
    <p style="color:var(--text-dim);font-size:18px;max-width:620px;margin:0;">
      Четыре направления — монтаж, съёмка, моушн-дизайн и ИИ-генерации. Выбери категорию.
    </p>
  </div>
</section>

<section class="section" data-portfolio-full style="padding-top:0;"></section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="card reveal" style="text-align:center;padding:52px 40px;">
      <h2 style="font-size:clamp(24px,3.4vw,34px);margin-bottom:14px;">Хочешь такой же результат?</h2>
      <p style="color:var(--text-dim);max-width:520px;margin:0 auto 28px;">Расскажи о проекте — подберём формат под задачу и бюджет.</p>
      <a class="btn btn-primary" href="contacts.html">Обсудить проект</a>
    </div>
  </div>
</section>

<footer data-footer></footer>

<script src="data.js?v=7.5"></script>
<script src="assets/js/main.js?v=7.5"></script>

<script>
/* Плитки шоурила: открываем те же модалки, что и карточки портфолио */
(function () {
  var REEL = {
    showreal: {
      title: "Шоурил BRO MEDIA",
      description: "Сборник лучших работ студии",
      link: "https://storage.yandexcloud.net/bromedia-video/Showreal_bromedia.mp4",
      cat: "Шоурил"
    },
    ai: {
      title: "Портфолио ИИ-генераций",
      description: "ИИ-видео и генерации",
      link: "https://storage.yandexcloud.net/bromedia-video/portfolioAI.mp4",
      cat: "ИИ-генерации"
    }
  };
  document.querySelectorAll("[data-showreel]").forEach(function (el) {
    el.addEventListener("click", function () {
      var d = REEL[el.getAttribute("data-showreel")];
      if (d && typeof openVideoModal === "function") openVideoModal(d, d.cat);
    });
  });
})();
</script>
</body>
</html>
