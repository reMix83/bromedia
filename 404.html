<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — BRO MEDIA</title>
<meta name="description" content="Такой страницы на сайте BRO MEDIA нет.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header data-header></header>

<section class="section" style="min-height:70vh;display:flex;align-items:center;padding-top:150px;">
  <div class="wrap" style="text-align:center;">
    <div style="font-family:var(--font-head);font-size:clamp(90px,18vw,200px);font-weight:700;line-height:1;
                color:var(--neon-bright);text-shadow:0 0 40px var(--neon-glow),0 0 100px rgba(46,232,208,.2);">
      404
    </div>
    <h1 style="font-size:clamp(24px,4vw,38px);margin:24px 0 14px;">Такой страницы нет</h1>
    <p style="color:var(--text-dim);max-width:460px;margin:0 auto 34px;font-size:17px;">
      Возможно, ссылка устарела или в адресе опечатка. Зато точно есть портфолио.
    </p>
    <div class="hero-cta" style="justify-content:center;">
      <a class="btn btn-primary" href="/index.html">На главную</a>
      <a class="btn btn-ghost" href="/portfolio.html">Портфолио</a>
    </div>
  </div>
</section>

<footer data-footer></footer>

<script src="/data.js?v=3.8"></script>
<script src="/assets/js/main.js?v=3.8"></script>
<script>
  /* правим ссылки навигации под корень сайта */
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("[data-header] a, [data-footer] a").forEach(a => {
      const h = a.getAttribute("href");
      if (h && !h.startsWith("http") && !h.startsWith("/")) a.setAttribute("href", "/" + h);
    });
  });
</script>
</body>
</html>
